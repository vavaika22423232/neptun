# Gradle JVM optimization
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=false

# R8 full mode for better optimization
android.enableR8.fullMode=true

# Parallel builds
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Flutter build mode
flutter.buildMode=release

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.code.style=official

# Disable PNG crunching for faster builds
android.enablePngCrunchInReleaseBuilds=false

# Force Gradle to use Android Studio's bundled JDK (version 21) instead of system Java 25
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
