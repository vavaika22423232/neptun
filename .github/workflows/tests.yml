name: Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: nextjs-app/worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: nextjs-app/worker
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  nextjs-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nextjs-app/package-lock.json

      - name: Install dependencies
        working-directory: nextjs-app
        run: npm ci

      - name: Run lint
        working-directory: nextjs-app
        run: npm run lint

      - name: Run domain tests
        working-directory: nextjs-app
        run: npm run test:domain

  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ hashFiles('neptun_alarm_app/pubspec.lock') }}

      - name: No duplicate dart filenames
        working-directory: neptun_alarm_app
        run: dart run scripts/check_no_duplicate_dart.dart

      - name: flutter analyze
        working-directory: neptun_alarm_app
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        working-directory: neptun_alarm_app
        run: flutter test
