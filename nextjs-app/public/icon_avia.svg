        <path d="M0,-23 L1.8,-18 L0,-16 L-1.8,-18 Z" fill="#eeeeee" stroke="#222222" stroke-width="0.8"/>
        <!-- Main wings -->
        <path d="M3,-1 L20,2 L21,5 L3.5,9 Z" fill="#ffffff" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
        <path d="M-3,-1 L-20,2 L-21,5 L-3.5,9 Z" fill="#ffffff" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
