        <path d="M-2.5,14 L-9,19 L-8,22 L-1.5,18 Z" fill="#ffffff" stroke="#222222" stroke-width="1" stroke-linejoin="round"/>
        <!-- Vertical stabilizer -->
        <path d="M0,16 L1.2,21 L0,23 L-1.2,21 Z" fill="#f0f0f0" stroke="#222222" stroke-width="0.8"/>
        <!-- Cockpit -->
        <ellipse cx="0" cy="-12" rx="1.6" ry="3.5" fill="#d0d0d0" stroke="#333333" stroke-width="0.6"/>
        <ellipse cx="0" cy="-12.5" rx="0.9" ry="2.5" fill="#bbbbbb" opacity="0.7"/>
        <!-- Exhaust -->
        <ellipse cx="0" cy="22.5" rx="1.5" ry="1" fill="#FF6600" opacity="0.85"/>
        <ellipse cx="0" cy="22.5" rx="0.7" ry="0.6" fill="#FFCC00" opacity="0.9"/>
    </g>
