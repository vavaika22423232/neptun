# ===========================================
# Render.com Configuration - Next.js + Python Worker
# ===========================================
#
# Нова архітектура: Next.js (frontend + API) + Python worker (Telegram)
# Flask видалено повністю.

services:
  # ===== Next.js Web Application =====
  - type: web
    name: neptun-alerts
    runtime: node
    plan: pro
    region: frankfurt
    rootDir: nextjs-app
    
    # Build — must copy public + static into standalone dir (Next.js requirement)
    buildCommand: npm install && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
    
    # Start - use standalone server
    startCommand: node .next/standalone/server.js
    
    # Health check
    healthCheckPath: /api/health
    
    # Persistent disk for shared data with worker
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      
      # Alarms API
      - key: ALARM_API_KEY
        sync: false
      - key: ALARMS_API_KEY
        sync: false
      
      # Admin
      - key: AUTH_SECRET
        sync: false
      
      # Firebase (optional)
      - key: FIREBASE_CREDENTIALS
        sync: false
      
      # Data directory (shared with worker via disk)
      - key: DATA_DIR
        value: /data

    autoDeploy: true

  # ===== Python Worker (Telegram + Parser) =====
  - type: worker
    name: neptun-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: nextjs-app/worker
    
    # Build
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    
    # Start
    startCommand: python worker.py
    
    # Persistent disk (same as web - shared data)
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: TELEGRAM_CHANNELS
        value: mapstransler
      - key: OPENCAGE_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
      - key: MESSAGES_FILE
        value: /data/messages.json
      - key: PYTHONUNBUFFERED
        value: "1"

    autoDeploy: true
