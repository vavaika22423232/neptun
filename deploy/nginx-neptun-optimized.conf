# Требуется блок upstream nextjs в http { } — см. deploy/nginx-upstream-nextjs.conf
proxy_cache_path /tmp/nginx_api_cache levels=1:2 keys_zone=API_CACHE:10m inactive=5m max_size=100m;
proxy_cache_path /tmp/nginx_static_cache levels=1:2 keys_zone=STATIC:10m inactive=10m max_size=200m;

server {
    server_name neptun.in.ua www.neptun.in.ua;
    server_tokens off;

    # Reject requests with unknown Host headers
    if ($host !~* ^(neptun\.in\.ua|www\.neptun\.in\.ua)$) {
        return 444;
    }

    # --- Proxy Buffering (frees upstream workers faster) ---
    proxy_buffer_size 8k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_buffering on;

    # --- Nginx status (local only, for monitoring) ---
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://neptun.in.ua wss://neptun.in.ua; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;

    # Hide upstream server identity
    proxy_hide_header X-Powered-By;

    # --- Connection & Rate Limits (zones: deploy/nginx-http-limits-snippet.conf in http {}) ---
    limit_conn conn_per_ip 128;
    limit_req zone=req_per_ip burst=280 nodelay;

    # --- Static assets (Next.js build) ---
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache STATIC;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        access_log off;
    }

    # --- Audio files served from disk ---
    location /data/audio/ {
        alias /data/audio/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Chat images served from disk ---
    location /data/images/ {
        alias /data/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- /static/ and /icons/ — proxy to Next.js (disk alias /home/neptun/app/static/ is often missing after deploy)
    location /static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    # --- Sitemap — served directly from disk (avoids Next.js 500 in standalone)
    location = /sitemap.xml {
        root /home/neptun/app/public;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # --- Hot map assets: disk (no Node hop; neptun_static_nolimit zone — avoids req_per_ip storms)
    #     deploy.sh copies nextjs-app/public → .next/standalone/public
    location = /shahed3.webp {
        limit_req zone=neptun_static_nolimit burst=20000 nodelay;
        alias /home/neptun/app/.next/standalone/public/shahed3.webp;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location = /rozvedka2.webp {
        limit_req zone=neptun_static_nolimit burst=20000 nodelay;
        alias /home/neptun/app/.next/standalone/public/rozvedka2.webp;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location ~ ^/icon_[-a-z0-9_]+\.svg$ {
        limit_req zone=neptun_static_nolimit burst=20000 nodelay;
        root /home/neptun/app/.next/standalone/public;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ==============================================
    # HOT API ENDPOINTS — cached to reduce CPU load
    # ==============================================

    # /api/alarms/all — polled every 10s by every client (~1800 hits/min)
    # Include Origin in cache key: otherwise a cached response from a request without
    # Origin (curl, same-site) is served to Flutter Web with wrong/missing CORS headers.
    location = /api/alarms/all {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$http_origin";
        proxy_cache_valid 200 3s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        limit_req zone=api_poll burst=60 nodelay;
        proxy_read_timeout 75s;
    }

    # /data — polled every 10s by every client (~1100 hits/min)
    location = /data {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 3s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=60 nodelay;
        proxy_read_timeout 75s;
    }

    # /api/data — same data endpoint
    location = /api/data {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 3s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=60 nodelay;
        proxy_read_timeout 75s;
    }

    # /api/messages — polled by mobile app (~500 hits/min)
    location = /api/messages {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=60 nodelay;
        proxy_read_timeout 75s;
    }

    # /api/threats — polled periodically (~350 hits/min)
    location = /api/threats {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=60 nodelay;
        proxy_read_timeout 75s;
    }

    # Heavy public map assets are served directly by nginx so Next.js workers stay free for app/API work.
    location ~ ^/(ukraine_[A-Za-z0-9_-]+\.geojson|geoBoundaries-[A-Za-z0-9_-]+\.geojson)$ {
        root /home/neptun/app/.next/standalone/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location = /logonep.png {
        alias /home/neptun/app/.next/standalone/public/logonep.png;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # /api/health — hot path under load. Answer at nginx so public probes do not burn Next.js CPU.
    location = /api/health {
        default_type application/json;
        access_log off;
        add_header Cache-Control "no-store" always;
        return 200 "{\"status\":\"ok\",\"database\":\"healthy\",\"edge\":\"nginx\"}";
    }

    # ==============================================
    # SSE — Go SSE Gateway (port 4000)
    # ==============================================
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
        # chunked_transfer_encoding: default on — required for streaming SSE body
    }

    # SSE events endpoint
    location /api/events {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
    }

    # /api/alarm-status — polled by mobile app (Dart), GET cacheable
    location = /api/alarm-status {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 3s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # /api/presence — polled by mobile app
    location = /api/presence {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args$http_origin";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # /api/chat/messages — requires JWT, no nginx cache (app-level 2s cache)
    location = /api/chat/messages {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # ==============================================
    # Other API routes — no cache, retry on failure
    # ==============================================
    # /api/admin/* — auth enforced in Next.js (session cookie / X-Auth-Secret); not IP-gated
    # so map at neptun.in.ua can delete/hide markers with same session as public login.
    location /api/admin/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # /admin — password + rate limits in app; VPN optional (http://10.66.66.1/admin still works)
    # Mobile WebView and браузер используют тот же хост neptun.in.ua
    location /admin {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
    }

    # ==============================================
    # Default — Next.js pages, short cache
    # ==============================================
    # SVG map overlays — long cache, immutable content
    # ==============================================
    location ~* ^/ukraine_.*\.svg$ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    # ==============================================
    # Leaflet CSS — self-hosted, long cache
    # ==============================================
    location = /leaflet.css {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    # ==============================================
    # Default — Next.js pages, short cache
    # ==============================================
    # Root HTML — tiny nginx cache to absorb traffic spikes. Live map data still comes from API/SSE.
    location = / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_cache API_CACHE;
        proxy_cache_key "root:$uri$is_args$args$http_accept_encoding";
        proxy_cache_valid 200 10s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # HTML / RSC: never disk-cache in nginx (avoids old HTML + new _next chunks → 404 / wrong MIME)
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;

        proxy_cache off;
        add_header X-Cache-Status "BYPASS" always;
    }

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    client_max_body_size 10M;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/neptun.in.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neptun.in.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # OCSP stapling (supplements Certbot's TLS config)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
}

server {
    if ($host = www.neptun.in.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = neptun.in.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name neptun.in.ua www.neptun.in.ua _;
    return 404; # managed by Certbot
}
