# Neptun — nginx reverse proxy config
# HTTP → HTTPS redirect + proxy to Node.js on port 3000
# SSL will be added by certbot automatically

server {
    listen 80;
    listen [::]:80;
    server_name neptun.in.ua www.neptun.in.ua;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy everything to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for SSE (chat stream)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Disable buffering for SSE
        proxy_buffering off;
    }

    # Static files — serve directly from Next.js standalone
    location /_next/static/ {
        alias /home/neptun/app/nextjs-app/.next/standalone/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        alias /home/neptun/app/nextjs-app/public/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Max upload size (for chat, feedback, etc.)
    client_max_body_size 5M;
}
