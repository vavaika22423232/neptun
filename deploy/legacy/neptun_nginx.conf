# Требуется блок upstream nextjs в http { } — см. deploy/nginx-upstream-nextjs.conf
proxy_cache_path /tmp/nginx_api_cache levels=1:2 keys_zone=API_CACHE:10m inactive=5m max_size=100m;
proxy_cache_path /tmp/nginx_static_cache levels=1:2 keys_zone=STATIC:10m inactive=10m max_size=200m;

server {
    server_name neptun.in.ua www.neptun.in.ua _;
    server_tokens off;

    # --- Proxy Buffering (frees upstream workers faster) ---
    proxy_buffer_size 8k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_buffering on;

    # --- Nginx status (local only, for monitoring) ---
    location /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
        access_log off;
    }

    # --- Security Headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hide upstream server identity
    proxy_hide_header X-Powered-By;

    # --- Connection & Rate Limits ---
    limit_conn conn_per_ip 50;
    limit_req zone=req_per_ip burst=120 nodelay;

    # --- Static assets (Next.js build) ---
    location /_next/static/ {
        alias /home/neptun/app/.next/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Audio files served from disk ---
    location /data/audio/ {
        alias /data/audio/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Chat images served from disk ---
    location /data/images/ {
        alias /data/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Static files from app directory ---
    location /static/ {
        alias /home/neptun/app/.next/standalone/public/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /icons/ {
        alias /home/neptun/app/.next/standalone/public/icons/;
        expires 30d;
        access_log off;
    }

    # --- Sitemap — served directly from disk (avoids Next.js 500 in standalone)
    location = /sitemap.xml {
        root /home/neptun/app/public;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ==============================================
    # HOT API ENDPOINTS — cached to reduce CPU load
    # ==============================================

    # /api/alarms/all — polled every 10s by every client (~1800 hits/min)
    location = /api/alarms/all {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;

        limit_req zone=api_poll burst=5 nodelay;
        proxy_read_timeout 10s;
    }

    # /api/data — same data endpoint
    location = /api/data {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 1s;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=5 nodelay;
        proxy_read_timeout 10s;
    }

    # /api/threats — polled periodically (~350 hits/min)
    location = /api/threats {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_valid 200 10s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;

        limit_req zone=api_poll burst=5 nodelay;
        proxy_read_timeout 10s;
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","server":"nginx"}';
        access_log off;
    }

    # ==============================================
    # SSE — Go SSE Gateway (port 4000)
    # ==============================================
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
    }

    # SSE events endpoint
    location /api/events {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        gzip off;
    }

    # /api/alarm-status — polled by mobile app (Dart), GET cacheable
    location = /api/alarm-status {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache API_CACHE;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_valid 200 3s;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ==============================================
    # Other API routes — no cache, retry on failure
    # ==============================================
    location /api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;
    }

    # ==============================================
    # Default — Next.js pages, short cache
    # ==============================================
    location ~* ^/ukraine_.*\.svg$ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location = /leaflet.css {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache STATIC;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Set-Cookie;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    # --- Direct static serving for public assets ---
    location ~* ^/(shahed3\.webp|rozvedka2\.png|icon_.*\.svg|artillery\.png|fpv\.png|trivoga\.png|vidboi\.png|favicon\.ico)$ {
        root /home/neptun/app/public/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri @nextjs_fallback;
    }

    location @nextjs_fallback {
        proxy_pass http://nextjs;
    }

    # HTML / RSC: no disk cache — stale HTML + fresh build = chunk 404 + text/plain
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
        proxy_next_upstream_tries 2;

        proxy_cache off;
        add_header X-Cache-Status "BYPASS" always;
    }

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    client_max_body_size 10M;

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/neptun.in.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/neptun.in.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # OCSP stapling (supplements Certbot's TLS config)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
}

server {
    if ($host = www.neptun.in.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = neptun.in.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name neptun.in.ua www.neptun.in.ua _;
    return 404; # managed by Certbot
}
