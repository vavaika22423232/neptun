# Neptun — upstream для proxy_pass http://nextjs;
#
# Подключить ВНУТРИ блока http { } в /etc/nginx/nginx.conf, например:
#   include /home/neptun/app/deploy/nginx-upstream-nextjs.conf;
# (или скопировать в /etc/nginx/snippets/ и include оттуда)
#
# ВАЖНО: список портов должен совпадать с nextjs-app/ecosystem.config.cjs
# (BASE_PORT и INSTANCES). Сейчас INSTANCES=2 → только 3000 и 3001.
# Если на сервере в upstream остались 3002/3003 при двух воркерах — будет
# постоянный connection refused и nginx временно «убивает» весь пул.

upstream nextjs {
    least_conn;
    server 127.0.0.1:3000 max_fails=5 fail_timeout=30s;
    server 127.0.0.1:3001 max_fails=5 fail_timeout=30s;
}

# Раскомментируйте две строки ниже, если в ecosystem.config.cjs INSTANCES: 4
#    server 127.0.0.1:3002 max_fails=5 fail_timeout=30s;
#    server 127.0.0.1:3003 max_fails=5 fail_timeout=30s;
