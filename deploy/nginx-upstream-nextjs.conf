# Neptun — upstream для proxy_pass http://nextjs;
#
# Подключить ВНУТРИ блока http { } в /etc/nginx/nginx.conf, например:
#   include /home/neptun/app/deploy/nginx-upstream-nextjs.conf;
# (или скопировать в /etc/nginx/snippets/ и include оттуда)
#
# ВАЖНО: число строк server = PM2_INSTANCES в .env (по умолчанию 4 в ecosystem.config.cjs).
# Сгенерировать блок:  source /home/neptun/app/.env && bash deploy/print-nginx-upstream.sh
# Несовпадение портов → connection refused → 502 Bad Gateway.

upstream nextjs {
    least_conn;
    keepalive 64;
    keepalive_requests 200;
    keepalive_timeout 60s;
    server 127.0.0.1:3000 max_fails=10 fail_timeout=20s;
    server 127.0.0.1:3001 max_fails=10 fail_timeout=20s;
    server 127.0.0.1:3002 max_fails=10 fail_timeout=20s;
    server 127.0.0.1:3003 max_fails=10 fail_timeout=20s;
}

# При PM2_INSTANCES=5+ добавьте:
#    server 127.0.0.1:3004 max_fails=5 fail_timeout=30s;
