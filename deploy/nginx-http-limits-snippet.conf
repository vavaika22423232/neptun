# Neptun — rate limit zones (include ONCE inside http { } in /etc/nginx/nginx.conf)
#
# If nginx fails with "duplicate zone name", remove older limit_req_zone / limit_conn_zone
# lines for req_per_ip, api_poll, conn_per_ip before including this file.
#
# After edit: sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=req_per_ip:32m rate=80r/s;
limit_req_zone $binary_remote_addr zone=api_poll:16m rate=40r/s;
# Very high rate for hot static paths (nginx <1.18 has no `limit_req off` in location)
limit_req_zone $binary_remote_addr zone=neptun_static_nolimit:8m rate=100000r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:16m;
