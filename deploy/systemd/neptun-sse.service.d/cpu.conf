[Service]
# Cap SSE gateway CPU so Next.js workers get scheduling time under chat load.
# Install: sudo mkdir -p /etc/systemd/system/neptun-sse.service.d
#          sudo cp deploy/systemd/neptun-sse.service.d/cpu.conf /etc/systemd/system/neptun-sse.service.d/
#          sudo systemctl daemon-reload && sudo systemctl restart neptun-sse
CPUQuota=450%
CPUWeight=80
